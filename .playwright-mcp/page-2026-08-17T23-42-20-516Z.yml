                            - article [ref=f29e478]:
                                - generic [ref=f29e479]:
                                    - 'heading "TOPP: The Open Problems Project" [level=1] [ref=f29e480]'
                                    - 'link "Permalink: TOPP: The Open Problems Project" [ref=f29e481] [cursor=pointer]':
                                        - /url: "#topp-the-open-problems-project"
                                - paragraph [ref=f29e484]:
                                    - link "TOPP.py" [ref=f29e485] [cursor=pointer]:
                                        - /url: /edemaine/topp/blob/main/TOPP.py
                                    - text: is an
                                    - link "open-source" [ref=f29e486] [cursor=pointer]:
                                        - /url: /edemaine/topp/blob/main/LICENSE
                                    - text: tool for converting TOPP-style
                                    - link "problem specification files" [ref=f29e487] [cursor=pointer]:
                                        - /url: /edemaine/topp/blob/main/Problems
                                    - text: into a website with those problems. It uses
                                    - link "pandoc" [ref=f29e488] [cursor=pointer]:
                                        - /url: https://pandoc.org/
                                    - text: to convert (limited) LaTeX into HTML, including
                                    - link "KaTeX" [ref=f29e489] [cursor=pointer]:
                                        - /url: https://katex.org/
                                    - text: for powerful LaTeX math rendering.
                                - paragraph [ref=f29e490]:
                                    - text: In particular, this repository builds
                                    - link "the official TOPP problem list" [ref=f29e491] [cursor=pointer]:
                                        - /url: https://topp.openproblem.net/
                                    - text: via
                                    - link "Netlify" [ref=f29e492] [cursor=pointer]:
                                        - /url: https://www.netlify.com/
                                    - text: . To build locally, install texlive and run
                                    - code [ref=f29e493]: python2 TOPP.py
                                    - text: to make an
                                    - code [ref=f29e494]: html
                                    - text: directory.
                                - generic [ref=f29e495]:
                                    - heading "Submitting Updates" [level=2] [ref=f29e496]
                                    - 'link "Permalink: Submitting Updates" [ref=f29e497] [cursor=pointer]':
                                        - /url: "#submitting-updates"
                                - paragraph [ref=f29e500]:
                                    - text: If you'd like to update any of the TOPP problems — for example, to indicate progress from a recent paper or to correct a typo — then please make a
                                    - link "Github Pull Request" [ref=f29e501] [cursor=pointer]:
                                        - /url: https://opensource.com/article/19/7/create-pull-request-github
                                    - text: ". You probably want to:"
                                - list [ref=f29e502]:
                                    - listitem [ref=f29e503]:
                                        - text: edit a
                                        - link "problem specification file" [ref=f29e504] [cursor=pointer]:
                                            - /url: /edemaine/topp/blob/main/Problems
                                        - text: ", and"
                                    - listitem [ref=f29e505]:
                                        - text: add an entry to
                                        - link "the BibTeX file" [ref=f29e506] [cursor=pointer]:
                                            - /url: /edemaine/topp/blob/main/topp.bib
                                        - text: .
                                - paragraph [ref=f29e507]:
                                    - text: To correct a typo without adding a bib entry, you can go to the
                                    - link "problem specification file" [ref=f29e508] [cursor=pointer]:
                                        - /url: /edemaine/topp/blob/main/Problems
                                    - text: and click Github's Edit button. This will create a fork with your change, which you can submit as a PR.
                                - paragraph [ref=f29e509]:
                                    - text: In the past, new problem submissions were created using
                                    - link "this problem template" [ref=f29e510] [cursor=pointer]:
                                        - /url: /edemaine/topp/blob/main/Problems/problem.template
                                    - text: . Feel free to use this template in your own project.
