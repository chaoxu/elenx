                        - heading "Database of Interesting Graphs" [level=1] [ref=f19e22]
                        - paragraph [ref=f19e23]:
                            - text: Most graph theorists will agree that among the vast number of graphs that exist, there are only a few thousand that can be considered really
                            - emphasis [ref=f19e24]: interesting
                            - text: .
                        - paragraph [ref=f19e25]:
                            - text: It is the aim of this House of Graphs project to find a workable definition of 'interesting' and provide a
                            - link "searchable database" [ref=f19e26] [cursor=pointer]:
                                - /url: /search
                            - text: of graphs that conform to this definition. Note that the searchable database does
                            - emphasis [ref=f19e27]: not
                            - text: contain all graphs of a given order, but only the ones which are considered 'interesting' by at least one of the users. We also allow users to add additional graphs which they find interesting. In order to avoid abuse, only
                            - link "registered" [ref=f19e28] [cursor=pointer]:
                                - /url: /register
                            - text: users can add new graphs.
                    - generic [ref=f19e29]:
