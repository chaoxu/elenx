    - heading "Introduction" [level=2] [ref=f28e7]
    - paragraph [ref=f28e8]:
        - text: This project originally aimed to record important open problems of interest to researchers in computational geometry and related fields. It commenced in 2001 with the publication of thirty problems in Computational Geometry Column 42
        - link "[MO01]" [ref=f28e9] [cursor=pointer]:
            - /url: "#MO01"
        - text: (see
        - link "Problems 1–30" [ref=f28e10] [cursor=pointer]:
            - /url: /problems_by_number
        - text: ), and then grew to over 75 problems.
    - paragraph [ref=f28e11]:
        - text: While we are no longer encouraging new problem submissions, we strongly encourage updates to existing problems, especially when those problems have been solved (completely or partially). Updates should be done in the form of a Github Pull Request; see the
        - link "Github repository" [ref=f28e12] [cursor=pointer]:
            - /url: https://github.com/edemaine/topp
        - text: .
    - paragraph [ref=f28e13]: Each problem is assigned a unique number for citation purposes. Problem numbers also indicate the order in which the problems were entered. Each problem is classified as belonging to one or more categories.
    - paragraph [ref=f28e14]:
        - text: The problems are also available as a single
        - link "PDF" [ref=f28e15] [cursor=pointer]:
            - /url: master.pdf
        - text: file.
    - heading [level=2] [ref=f28e16]:
        - link "Numerical List of All Problems" [ref=f28e17] [cursor=pointer]:
            - /url: /problems_by_number
    - paragraph [ref=f28e18]:
        - text: To begin navigating through the open problems, you may select from a category of interest below, or view
        - link "a list of all problems sorted numerically" [ref=f28e19] [cursor=pointer]:
            - /url: /problems_by_number
        - text: .
    - heading "Categorized List of All Problems" [level=2] [ref=f28e20]
    - paragraph [ref=f28e21]: Below, each category lists the problems that are classified under that category. Note that each problem may be classified under several categories.
